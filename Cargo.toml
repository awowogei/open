[package]
name = "open"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.1", features = ["derive"] }
freedesktop_entry_parser = "1.3.0"
mime = "0.3.17"
anyhow = "1.0.102"
xdg_base_dirs = { version = "2.5.2", package = "xdg" }
# Needed for https://github.com/ebassi/xdg-mime-rs/pull/30
# So files with extensions are not counted as x-zerosize
xdg-mime = { git = "https://github.com/ebassi/xdg-mime-rs", rev = "f8efb3f" }
